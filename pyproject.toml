[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "betexplorer-scraper"
version = "0.1.0"
description = "BetExplorer odds and results capture with local monitoring API"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "duckdb>=1.1.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "lxml>=5.0.0",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-docx>=1.1.2",
  "python-dotenv>=1.0.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.setuptools.packages.find]
where = ["apps/api/src"]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["tests"]
